# Logs never contain tokens or health values; keep framework chatter down.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.io.netty=error
org.slf4j.simpleLogger.log.io.ktor=warn
# Netty's TLS handshake-failure warning hex-dumps the first bytes a client sent. For a client that wrongly
# speaks plain HTTP that is the request itself, including any Authorization header, so it is silenced.
org.slf4j.simpleLogger.log.io.netty.handler.ssl=off
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSZ
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
